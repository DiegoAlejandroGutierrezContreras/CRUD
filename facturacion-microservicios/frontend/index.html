<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Sistema de Facturación Digital</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

  <!-- Contenedor para notificaciones toast -->
  <div data-hook="toast-container" id="toast-container"></div>

  <main class="container" style="max-width: 460px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <header class="text-center mb-4">
          <h1 class="h3 fw-bold text-dark">Facturación Digital</h1>
          <p class="text-muted small">Microservicios</p>
        </header>

        <!-- Navegación de pestañas Login / Registro -->
        <ul class="nav nav-pills nav-fill mb-4" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-hook="tab-login-btn" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Iniciar Sesión</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-hook="tab-register-btn" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab">Registrarse</button>
          </li>
        </ul>

        <div class="tab-content">
          <!-- Formulario de Iniciar Sesión -->
          <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
            <form data-hook="login-form">
              <div class="mb-3">
                <label for="login-email" class="form-label small fw-semibold">Correo Electrónico</label>
                <input type="email" class="form-control" id="login-email" data-hook="login-email" placeholder="ejemplo@correo.com" required autocomplete="email">
              </div>
              <div class="mb-4">
                <label for="login-password" class="form-label small fw-semibold">Contraseña</label>
                <input type="password" class="form-control" id="login-password" data-hook="login-password" placeholder="••••••••" required autocomplete="current-password">
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" data-hook="btn-login-submit">Ingresar</button>
            </form>
          </div>

          <!-- Formulario de Registro -->
          <div class="tab-pane fade" id="pills-register" role="tabpanel">
            <form data-hook="register-form">
              <div class="mb-3">
                <label for="register-nombre" class="form-label small fw-semibold">Nombre Completo</label>
                <input type="text" class="form-control" id="register-nombre" data-hook="register-nombre" placeholder="Juan Pérez" required>
              </div>
              <div class="mb-3">
                <label for="register-email" class="form-label small fw-semibold">Correo Electrónico</label>
                <input type="email" class="form-control" id="register-email" data-hook="register-email" placeholder="juan@correo.com" required>
              </div>
              <div class="mb-4">
                <label for="register-password" class="form-label small fw-semibold">Contraseña</label>
                <input type="password" class="form-control" id="register-password" data-hook="register-password" placeholder="Mínimo 6 caracteres" minlength="6" required autocomplete="new-password">
              </div>
              <button type="submit" class="btn btn-success w-100 py-2 fw-semibold" data-hook="btn-register-submit">Crear Cuenta</button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script de inicio de sesión y registro -->
  <script type="module">
    import { initAuthPage } from './js/auth.js';
    document.addEventListener('DOMContentLoaded', () => {
      initAuthPage();
    });
  </script>
</body>
</html>
